  # REST API Service
  api:
    build:
      context: .
      dockerfile: Containerfile.api
    container_name: ci-audit-api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-ci_audit}
